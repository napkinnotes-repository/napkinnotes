name: Generate certificate for changed articles

on:
  push:
    paths:
      - "documentation/content/articulos/**/*.md"
      - "documentation/content/theme/images/nn_logo.png"
      - "documentation/content/images/firma.png"
      - "documentation/content/scripts/generate_certificates_from_articles.py"
      - "documentation/requirements.txt"
      - ".github/workflows/generate-certificates.yml"

permissions:
  contents: write

jobs:
  generate-certificates:
    runs-on: ubuntu-latest

    if: "!contains(github.event.head_commit.message, '[skip certificates]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect new or modified article files
        id: changed_articles
        shell: bash
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM HEAD^ HEAD -- 'documentation/content/articulos/**/*.md' | tr '\n' ' ')

          echo "Changed article files:"
          echo "$CHANGED_FILES"

          echo "files=$CHANGED_FILES" >> "$GITHUB_OUTPUT"

      - name: Stop if no article changed
        if: steps.changed_articles.outputs.files == ''
        run: |
          echo "No new or modified article files detected."

      - name: Set up Python
        if: steps.changed_articles.outputs.files != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.changed_articles.outputs.files != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r documentation/requirements.txt

      - name: Generate certificates only for changed articles
        if: steps.changed_articles.outputs.files != ''
        run: |
          python documentation/content/scripts/generate_certificates_from_articles.py ${{ steps.changed_articles.outputs.files }}

      - name: Commit generated certificates
        if: steps.changed_articles.outputs.files != ''
        run: |
          if [ -n "$(git status --porcelain documentation/content/certificados)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add documentation/content/certificados
            git commit -m "Generate certificates [skip certificates]"
            git push
          else
            echo "No certificate changes to commit."
          fi